<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneTicket Fintech | OneKhusa Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scale-up { animation: scaleUp 0.4s ease-out forwards; }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-900">

    <div id="app" class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12">
            <h1 class="text-3xl font-black text-blue-700 uppercase tracking-tighter">
                ONETICKET <span class="text-slate-300 font-light italic text-xl">FINTECH</span>
            </h1>
            <div class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-xs font-bold mt-4 md:mt-0 flex items-center gap-2">
                <span class="w-2 h-2 bg-blue-600 rounded-full animate-pulse"></span> NODE.JS HOSTED CHECKOUT
            </div>
        </header>

        <main>
            <!-- Purchase View -->
            <div id="view-purchase" class="max-w-xl mx-auto space-y-6">
                <div class="bg-white p-10 rounded-[3rem] border shadow-sm">
                    <div class="text-center">
                        <i data-lucide="ticket" class="mx-auto text-blue-600 mb-4 opacity-20 w-16 h-16"></i>
                        <h2 class="text-2xl font-bold mb-2 text-slate-400">Node.js Hosted Checkout</h2>
                        <p class="text-sm text-slate-500 mb-6">Enter the payment details — you'll be redirected to the OneKhusa hosted checkout page to complete payment.</p>
                    </div>

                    <div class="space-y-4 text-left">
                        <div>
                            <label class="text-xs font-bold uppercase tracking-widest text-slate-400">Reference Number (5-25 alphanumeric)</label>
                            <div class="flex gap-2 mt-1">
                                <input id="reference" type="text" maxlength="25" placeholder="e.g. 1020XDFS76GS777"
                                       class="flex-1 px-4 py-3 rounded-2xl border border-slate-200 focus:border-blue-400 focus:outline-none" />
                                <button type="button" onclick="generateRef()"
                                        class="px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-sm font-bold text-slate-600">Generate</button>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold uppercase tracking-widest text-slate-400">Amount</label>
                            <input id="amount" type="number" step="0.01" min="0.01" placeholder="e.g. 2500.00"
                                   class="mt-1 w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-blue-400 focus:outline-none" />
                        </div>

                        <div>
                            <label class="text-xs font-bold uppercase tracking-widest text-slate-400">Description</label>
                            <input id="description" type="text" placeholder="e.g. Samsung 85inch TV purchase"
                                   class="mt-1 w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-blue-400 focus:outline-none" />
                        </div>
                    </div>

                    <button id="buyBtn" onclick="handleBuy()" class="mt-6 w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black text-xl flex justify-center items-center gap-3 hover:bg-blue-600 transition disabled:opacity-50 shadow-xl">
                        <i data-lucide="credit-card"></i>
                        <span id="buyBtnText">PURCHASE WITH HOSTED CHECKOUT</span>
                    </button>
                </div>
            </div>
        </main>

        <footer class="mt-20 text-center text-slate-400 text-[10px] uppercase tracking-[0.2em] font-bold">
            OneKhusa Node.js Reference &copy; 2026
        </footer>
    </div>

    <script>
        function generateRef() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let ref = '';
            for (let i = 0; i < 15; i++) ref += chars[Math.floor(Math.random() * chars.length)];
            document.getElementById('reference').value = ref;
        }

        async function handleBuy() {
            const btn = document.getElementById('buyBtn');
            const btnText = document.getElementById('buyBtnText');
            const ref = document.getElementById('reference').value.trim();
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value.trim();

            if (!ref || !amount || !description) {
                alert('Please fill in the reference number, amount and description.');
                return;
            }

            btn.disabled = true;
            btnText.innerText = 'REDIRECTING...';

            try {
                const res = await fetch('/api/Tickets/buy/showcase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reference: ref, amount: parseFloat(amount), description }),
                });
                const result = await res.json();

                if (result.status === 'success') {
                    window.location.href = result.redirectUrl;
                } else {
                    alert('Checkout failed: ' + result.message);
                    btnText.innerText = 'PURCHASE WITH HOSTED CHECKOUT';
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Connection error');
                btnText.innerText = 'PURCHASE WITH HOSTED CHECKOUT';
                btn.disabled = false;
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
